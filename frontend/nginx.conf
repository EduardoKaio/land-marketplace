server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same origin for the page and the API, as the Vite proxy does in development, so the browser
    # needs no CORS. "api" is the Compose service name, resolved by Docker's internal DNS
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in these file names, so a changed file gets a new URL and can be
    # cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single page app: any other path that is not a file gets index.html. Never cached, so a new
    # deploy is picked up on the next load
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
