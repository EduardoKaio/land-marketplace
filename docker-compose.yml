name: land-marketplace

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-landmarket}
      POSTGRES_USER: ${POSTGRES_USER:-landmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-landmarket}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes Compose interpolation so the shell inside the container expands the variables
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
