spring:
  application:
    name: land-marketplace-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/landmarket}
    username: ${DB_USERNAME:landmarket}
    password: ${DB_PASSWORD:landmarket}
  jpa:
    # Keeps the persistence context closed outside the transactional service layer
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # *:future is the Flyway default. repeatable:missing lets the API start without the demo
    # profile on a database that once ran it: the demo seed is the only repeatable migration, so
    # versioned migrations are still fully validated
    ignore-migration-patterns: "*:future,repeatable:missing"
  web:
    # Error messages, Bean Validation ones included, are always English, whatever the JVM locale
    # or the Accept-Language header
    locale: en
    locale-resolver: fixed

server:
  error:
    # Already the defaults; explicit because errors that never reach Spring MVC (filters) are
    # rendered by Spring Boot and must not expose internals either
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

land-lot:
  query:
    # Caps the circle search so one request cannot scan a whole region
    max-search-radius-meters: ${LAND_LOT_MAX_SEARCH_RADIUS_METERS:50000}
    # Most lots returned for one map viewport
    max-bbox-results: ${LAND_LOT_MAX_BBOX_RESULTS:500}

app:
  jwt:
    # HMAC key of the access tokens, at least 32 bytes. The default is for development only: any
    # deployment must set JWT_SECRET, or anyone who reads this file can forge tokens
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-deployment}
    expiration: ${JWT_EXPIRATION:PT2H}
    issuer: land-marketplace-api
  cors:
    # Comma separated exact origins; the default is the Vite dev server
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
